laude Opus 4.8 (1M context) <noreply@anthropic.com>"}, {"sha": "ee7c2cd", "at": "2026-09-13T23:17:08+02:00", "title": "feat(WP6): Replay-Eval, Langfuse-Tracing und Observability-ADR", "type": "feat", "scope": "WP6", "body": "Gebaut: evals/run_evals.py als echte Mock-Eval (Fälle über replay.select_replay_cases,\nGraph je Fall mit sim_now, Vergleich über replay.score, deterministische Prüfungen);\nevals/report.md und evals/scenarios.json aus echtem Mock-Lauf; optionaler\nLangfuse-Callback (evals/langfuse_tracing.py, nur bei langfuse_enabled, offline-sicher);\ndocker-compose.langfuse.yml; .gitlab-ci.yml Stage evals (ohne --live);\ndocs/adr/0007-observability.md.\nGetestet: ruff grün, pytest 378 passed (Coverage 87 %); WP6-Gate grün\n(acceptance + gate_no_skip + run_evals + report.md); je Verifikations- und\nFalsifikationstest für die neuen Eval- und Tracing-Funktionen.\nOffen: Langfuse-Trace real gegen laufenden Stack nur bei gesetzten Keys (Callback über\nconfig injiziert, nicht end-to-end gegen echten Server verifiziert – Stefan manuell);\nKonfidenz-Obergrenze nutzt nur den Ursachenanteil-Term sauber, die übrigen Terme\nkonservativ als Maximum.\n\nWarum: WP6 verlangt messbare Eval (ADR-0002) und Observability; Skelett erzeugte kein report.md.\n\nGate: grün | Review: human | Guardian: ok"}, {"sha": "b8a3d73", "at": "2026-09-13T23:31:59+02:00", "title": "docs(WP7): Demo-Skript 60 min, ADR-Vollständigkeit bestätigt", "type": "docs", "scope": "WP7", "body": "Gebaut: docs/demo_script.md für die 60-Minuten-Demo (12 min Live-Demo\nab Panel 7 rückwärts über die echten sieben Graph-Knoten, 30 min\nEntscheidungen je ADR ein Satz, 18 min Fragen mit drei Nachfragen und\nwörtlichen Ehrlichkeitsgrenzen, fünf Kernsätze, Zeit-Sicherung). ADR-\nVollständigkeit gegen die acht Themen geprüft: alle vorhanden, keine\nneue ADR nötig. evals/run_evals.py per ruff format normalisiert.\nGetestet: ruff, pytest (mock), WP7-Gate, gate_no_skip WP7, make lint\ntest (Coverage über 80), make security – alle grün.\nOffen: README/docs/CHANGELOG.md und ADR-Anlage liegen außerhalb der\nSchreibzone dieses Agenten; als Bedarf gemeldet.\n\nWarum: WP7-Kernartefakt fehlte und der WP7-Abnahmetest war übersprungen.\n\nGate: grün | Review: human | Guardian: ok"}, {"sha": "5c453af", "at": "2026-09-13T23:37:50+02:00", "title": "docs(WP7): README-Demostart, Architekturbild und CHANGELOG", "type": "docs", "scope": "WP7", "body": "Gebaut: README-Abschnitte Demo-App-Start (5 Befehle) + Architektur (Mermaid), neu docs/CHANGELOG.md.\nGetestet: ruff grün; keine Marker/Code berührt; Gate unverändert.\nOffen: Graph-Verdrahtung WP4-Regeln/CBR (bewusst nach dem Interview).\n\nGate: grün | Review: human | Guardian: ok\n\nCo-Authored-By: Claude Opus 4.8 (1M context) <noreply@anthropic.com>"}, {"sha": "0131dd4", "at": "2026-09-14T08:42:30+02:00", "title": "feat(WP5): Erzähltext je Knoten und reason_hit nach Freigabe", "type": "feat", "scope": "WP5", "body": "Gebaut: narrative.ts + Erzähl-Panel, reason_hit/belegte Maßnahmen serverseitig nach Freigabe, optionaler delay_ms-Demo-Takt, Playwright-Walkthrough. Getestet: ruff+pytest+npm build grün; UI-Walkthrough 17 Screenshots, 0 Auffälligkeiten. Offen: Judge-Schritt folgt separat. Warum: Cockpit erzählt den Lauf und zeigt die Eval, ohne ADR-0002 zu verletzen.\n\nGate: grün | Review: human | Guardian: ok"}, {"sha": "c58017a", "at": "2026-09-14T09:14:04+02:00", "title": "feat(graph): LLM-as-Judge validiert Maßnahmen-Belege unabhängig", "type": "feat", "scope": "graph", "body": "Gebaut: Knoten Beleg-Prüfung (LLM-as-Judge, LLM_MODEL_JUDGE, getrennter Kontext), graph/judge.py, Mock-Judge, Frontend-Karte mit Badges + Judge-Status am Gate, ADR-0011. Getestet: ruff+pytest grün (Coverage 87%), npm build grün, UI-Walkthrough 14 Screenshots inkl. abgelehnter Maßnahme (0 Auffälligkeiten). Offen: -. Warum: unabhängige Kontrolle der Selbst-Belegung aus Knoten 6, kein Auto-Verwerfen.\n\nGate: grün | Review: human | Guardian: ok"}, {"sha": "c1b3083", "at": "  "5b1309e", "at": "2026-09-14T17:24:22+02:00", "title": "fix(ops): Config-Speichern repariert, Browser-Test klickt Speichern", "type": "fix", "scope": "ops", "body": "Gebaut: Config-Feld-Builder auf data-Attribute + delegierte Handler (JSON.stringify(key) brach das onclick-Attribut → kein PUT); ops_check.py klickt Speichern und verlangt PUT 200. Getestet: ruff+pytest+selfcheck grün, ops_check 0 Konsolenfehler + PUT 200 reproduziert. Offen: -. Warum: Schwelle/Regeln ließen sich im Cockpit nicht speichern (reiner Frontend-Quote-Bug).\n\nGate: grün | Review: human | Guardian: ok"}, {"sha": "b34028b", "at": "2026-09-14T17:43:07+02:00", "title": "fix(mcp): echter MCP-Protokollpfad via fastmcp.Client (opt-in, belegt)", "type": "fix", "scope": "mcp", "body": "Gebaut: build_tools_from_mcp über fastmcp.Client (stdio, ein Client je Server) statt kaputtem langchain-mcp-adapters; Flag use_mcp/MCP_VIA_PROTOCOL. Getestet: ruff+pytest grün, e2e_replay in-process grün, e2e über Protokoll grün (transport stdio + reason_hit True). Offen: Protokollpfad für die dauerhaft laufende API pro Request (ADR-0005). Warum: Case-Study MCP war nur import-broken in-process.\n\nGate: grün | Review: human | Guardian: ok"}, {"sha": "c244357", "at": "2026-09-15T00:30:27+02:00", "title": "fix(config): Cockpit-Schwelle wird genutzt (runtime.yaml-Override)", "type": "fix", "scope": "config", "body": "Gebaut: config.runtime_value() liest runtime.yaml frisch als Override; derive_actions nutzt es für die Konfidenzschwelle (bisher nur angezeigt, nicht genutzt). Getestet: test_runtime_override.py (Save→genutzt Verif + Falsif), ruff+pytest grün, e2e reason_hit True. Offen: -. Warum: Spec sagt Graph liest runtime.yaml, war nicht implementiert.\n\nGate: grün | Review: human | Guardian: ok"}, {"sha": "3dd8ee7", "at": "2026-09-15T10:16:05+02:00", "title": "Merge ux-overhaul: geführte React-Präsentation (:5173 + Ops-iframe)", "type": "sonstige", "scope": "", "body": "Gebaut: ux-overhaul in main integriert (eine React-Präsentation, Ops-iframe). Getestet: ruff+pytest grün, npm build grün, Konflikte (AENDERUNGEN, ops_check) beidseitig aufgelöst. Offen: 3 zurückgestellte Feature-Aufträge. Warum: geführte Interview-Demo braucht die heutigen main-Fixes.\n\nGate: grün | Review: human | Guardian: ok"}, {"sha": "6dbe1ea", "at": "2026-09-15T11:25:55+02:00", "title": "fix(audit): MCP-Protokoll als Demo-Default, Konfidenzschwelle-Drift", "type": "fix", "scope": "audit", "body": "Gebaut: D-1 server.py use_mcp=True (make run-api spawnt stdio-MCP ohne Flag; sys.executable statt python); D-2 Schwelle-Drift 0.65->0.60 reset, applied_threshold in State/Trace/e2e, Ops-Drift-Banner+Startup-Warnung+/api/config/drift. Getestet: ruff grün, pytest 400 passed/3 skipped/0 fail, 4 e2e reason_hit True, 3 UIs 0 Console-Errors, voller Speichern->genutzt-Kreis 0.55 belegt. Offen: 3 zurückgestellte Feature-Aufträge. Warum: Audit-Befunde D-1/D-2 (docs/independent_audit_2026-09-16.md).\n\nGate: grün | Review: human | Guardian: ok"}, {"sha": "e6661df", "at": "2026-09-15T12:40:46+02:00", "title": "feat(agent_tab): Freigabe-Seite, Konfidenzbalken, Badges, Belegtext", "type": "feat", "scope": "agent_tab", "body": "Gebaut: eigenständige Route /freigabe (ApprovalPage) – beste Hypothese mit Konfidenz + Schwellenlinie (Laufzeit), Maßnahmenkarten mit Policy-Badge/Konfidenzbalken/Original-Belegtext, Unter-Schwelle-Karte, Freigeben/Ablehnen. Backend: derive_actions reicht Original-Belegtext durch (attach_belegtext), applied_threshold im Interrupt-Payload. Getestet: ruff grün, pytest 404 passed/3 skipped, 4 e2e reason_hit True, 4 UIs 0 Console-Errors, beide Testfälle (über/unter Schwelle) per Playwright + Screenshot. Offen: zurückgestellte Aufträge (Freigabe-Pflichtgrund, RAG-Rang). Warum: gefordertes Feature war nie umgesetzt (git log leer).\n\nGate: grün | Review: human | Guardian: ok"}, {"sha": "f872c37", "at": "2026-09-15T13:56:13+02:00", "title": "feat(ui): 6-Tab-Cockpit: Bediener, Live, MCP, RAG, Sicherheit, Konfig ng, Modell und Hybrid-Suche", "decision": "- **Chunking:** absatzweise mit Überschrift-Präfix (`[Abschnitt] Text`).\n- **Modell:** `intfloat/multilingual-e5-small` (Deutsch nativ, CPU, kein API-Schlüssel, MIT).\n- **Suche:** Reciprocal Rank Fusion (k=60), BM25 bei erkanntem Alarmcode `[EWI]-\\d{4}` doppelt gewichtet,\n  Fallback auf BM25-only bei fehlendem Qdrant-Index.\n\nBegründung und die jeweils verworfenen Alternativen stehen ausführlich in"}, {"file": "0005-mcp-werkzeuge.md", "title": "ADR-0005: Sechs fachliche MCP-Werkzeuge statt generischem SQL", "decision": "Eigener Server (FastMCP standalone 4.x, stdio). Werkzeuge: get_line_status, get_active_alarms, get_alarm_history, get_production_plan, estimate_impact, find_similar_incidents. Jedes läuft durch sql_guard, injection_guard und audit; jedes filtert auf die Replay-Uhr. Der Guardian erzwingt genau 6 + 1 Werkzeuge (S3)."}, {"file": "0006-konfidenzschwelle.md", "title": "ADR-0006: Konfidenzschwelle und Konfidenzformel für Knoten 4", "decision": "Option A. Schwelle 0.60 (aus decisions.yaml `konfidenz.schwelle_empfehlung`).\n\n**Begründung Arbeitspunkt 0.60:** Auf einer Hochleistungslinie mit 200 €/min ist eine\nEmpfehlung mit 60 % Konfidenz billiger als zehn Minuten Warten auf 70 %: der Techniker prüft\nvor Ort ohnehin, ein Fehlvorschlag kostet Minuten, ein verpasster kostet Tausende.\nDer Wert ist eine Geschäftsentscheidung des Werks und im Co"}, {"file": "0007-observability.md", "title": "ADR-0007: Observability über Langfuse (self-hosted)", "decision": "Langfuse self-hosted. Der Callback wird **außerhalb** des Graph-Codes injiziert\n(`evals/langfuse_tracing.py` → `config={\"callbacks\": [...]}`), damit der Graph ohne Langfuse\nunverändert und ohne Netzverbindung läuft. Aktiv nur bei gesetzten Keys\n(`Settings.langfuse_enabled`). Compose in `docker-compose.langfuse.yml`."}, {"file": "0008-modell-und-kontext.md", "title": "ADR-0008: Claude Sonnet 5 über langchain-anthropic, Context Engineering je Knoten", "decision": "Sonnet 5 als Default, Haiku 4.5 für Klassifikation und LLM-as-Judge. Jeder Knoten erhält nur seinen Kontext (kein Vollverlauf) – Context Rot ist belegt. Konfidenz wird nie vom Modell erhöht (Nachbedingung)."}, {"file": "0009-frontend.md", "title": "ADR-0009: Vite + React + shadcn/ui + Recharts, FastAPI/SSE", "decision": "Vite + React. Anbindung über FastAPI mit SSE (Event je Knoten), Freigabe über /investigations/approve → Command(resume). Demo-Modus ?demo=1 ohne Backend. CopilotKit/AG-UI wäre der Produktionsweg."}, {"file": "0010-mes-nachrichtenformat.md", "title": "ADR-0010: MES-Nachrichtenformat – OPC UA A&C + ISA-95 JSON", "decision": "Option A. Drei Pydantic-Modelle für die drei ISA-95-Ereignistypen:\n\n| Modell | ISA-95-Entität | OPC-UA-Quelle |\n|---|---|---|\n| `AlarmEvent` | AlarmEvent (A&C NodeClass) | OPC UA Server A&C-Interface |\n| `StateChange` | PackML-Zustandswechsel | OPC UA State Machine |\n| `OrderProgress` | WorkRequest / JobOrder | MES-ISA-95-Interface |\n\n**Topic-Schema:** `plant/<line_id>/<station>/<alarm|state|order"}, {"file": "0011-beleg-pruefung-judge.md", "title": "ADR-0011: Unabhängige Beleg-Prüfung der Maßnahmen (LLM-as-Judge)", "decision": "Option 3. Neuer linearer Knoten „Beleg-Prüfung\" (`check_evidence`) zwischen Knoten 6 und dem\nFreigabe-Gate. Er ruft je Maßnahme das Judge-Modell (`LLM_MODEL_JUDGE`) mit strikt getrenntem\nKontext auf (`graph/judge.py`), sammelt `judge_results` (verified, judge_note je Maßnahme) und\nreicht sie an das Gate weiter. Der Graph bleibt linear – keine neue Verzweigung, kein Eingriff in\ndie Knoten 1–6. Die "}], "quality": {"coverage_total": 84, "coverage_security": 100}, "costs": {"per_wp": {"WP1": 1.87, "WP2a": 2.51, "WP-B": 0.19, "WP2b": 2.47, "INF-3": 2.38, "INF-4": 0.2, "INF-9": 0.34, "INF-E": 1.43, "WP5": 0}, "loops": {"WP1": 2, "WP2a": 1, "WP-B": 1, "WP2b": 1, "INF-3": 1, "INF-4": 1, "INF-9": 1, "INF-E": 1, "WP5": 1}, "total": 11.39}, "sessions": [], "scope": {"title": "Scope-Entscheidung  b('entscheidungen').innerHTML=D.decisions.map(a=>`<div class="card"><b>${esc(a.title)}</b><br><small>${esc(a.file)}</small><p>${esc(a.decision)}</p></div>`).join('')||'<p>keine ADRs</p>';
 b('qualitaet').innerHTML=`<div class="card">Coverage gesamt: <b>${D.quality.coverage_total??'—'} %</b> · security <b>${D.quality.coverage_security??'—'} %</b></div><div class="card">Läufe mit Review: ${D.runs.filter(r=>r.review).map(r=>esc(r.wp)+':'+esc(r.review)).join(', ')||'—'}</div>`;
 b('kosten').innerHTML=`<div class="card">Gesamt: <b>${D.costs.total} USD</b></div>`+Object.entries(D.costs.per_wp).map(([w,c])=>`<div class="row">${esc(w)}: ${c} USD · ${D.costs.loops[w]||0} Loops</div>`).join('')||'<p>keine Kosten</p>';
 b('sitzungen').innerHTML=D.sessions.map(s=>`<div class="card"><b>${esc(s.file)}</b><pre style="white-space:pre-wrap">${esc(s.text)}</pre></div>`).join('')||'<p>keine Sitzungsdateien</p>';
}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
 document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
 document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));
 t.classList.add('active');document.getElementById('panel-'+t.dataset.tab).classList.add('active');
});
document.onkeydown=e=>{const t=[...document.querySelectorAll('.tab')];const i=t.findIndex(x=>x.classList.contains('active'));
 if(e.key==='ArrowRight'&&i<t.length-1)t[i+1].click();if(e.key==='ArrowLeft'&&i>0)t[i-1].click();};
render();
</script>
</body></html>
