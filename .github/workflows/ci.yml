name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Abhängigkeiten installieren
        run: pip install -e ".[dev]"

      - name: Linter
        run: ruff check .

      - name: Simulator (Testdaten erzeugen)
        run: python -m production_agent.data.simulator

      - name: Testsuite
        run: pytest -q

      - name: Statische Sicherheitsanalyse
        run: bandit -c pyproject.toml -r src

      - name: Abhängigkeits-Audit
        # setuptools ist Build-Tool der Runner-Umgebung, keine deklarierte Laufzeit-Abhängigkeit;
        # vor dem Audit auf die Fix-Version heben, damit Umgebungs-CVEs (PYSEC-2026-3447) den
        # Audit der Projekt-Abhängigkeiten nicht verfälschen.
        run: |
          python -m pip install --upgrade "setuptools>=83.0.0"
          pip-audit

  frontend:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # hashFiles wertet das Runner-Workspace aus und ist erst nach dem Checkout gültig –
      # auf Job-Ebene (if:) liefert es immer '' und übersprang den Job stillschweigend.
      - name: Frontend vorhanden?
        id: check
        run: |
          if [ -n "${{ hashFiles('frontend/package.json') }}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.check.outputs.present == 'true'
        with:
          node-version: "20"

      - name: Frontend-Abhängigkeiten installieren
        if: steps.check.outputs.present == 'true'
        run: npm ci
        working-directory: frontend

      - name: Frontend bauen
        if: steps.check.outputs.present == 'true'
        run: npm run build
        working-directory: frontend

  e2e:
    needs: [test, frontend]
    runs-on: ubuntu-latest
    if: |
      always() &&
      needs.test.result == 'success' &&
      (needs.frontend.result == 'success' || needs.frontend.result == 'skipped')
    env:
      # Bewusst KEIN MCP_VIA_PROTOCOL: der e2e-Playwright-Lauf muss den ECHTEN Demo-Default treffen
      # (make run-api ohne Flags = In-Process). Der Test würde bei falscher SIM_NOW-Propagation
      # rot (STO-UNBEKANNT statt STO-FOLIE) – er bewacht damit genau den reproduzierten Bug.
      LLM_MODE: mock
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Abhängigkeiten inkl. Playwright installieren
        run: pip install -e ".[dev,e2e]"

      - name: Playwright-Browser installieren
        run: playwright install chromium --with-deps

      # Finding E: die Vektor-Suche MUSS für die Demo verfügbar sein. CPU-Torch (kein CUDA) hält den
      # Job schlank; der HF-Cache spart den 470-MB-Modell-Download bei Folgeläufen.
      - name: HuggingFace-Modell-Cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-e5-small-v1

      - name: Embeddings (CPU-Torch) installieren — Vektor-Suche verpflichtend
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[embeddings]"

      - name: Frontend vorhanden?
        id: check
        run: |
          if [ -f frontend/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.check.outputs.present == 'true'
        with:
          node-version: "20"

      - name: Frontend-Abhängigkeiten installieren
        if: steps.check.outputs.present == 'true'
        run: npm ci
        working-directory: frontend

      - name: Simulator (Testdaten erzeugen)
        run: python -m production_agent.data.simulator

      - name: Vektor-Index bauen (Modell cachen) + Regressionstest der Vektor-Suche (Finding E)
        run: |
          python -m production_agent.mcp.rag_server --ingest
          pytest -q -m embeddings tests/test_vector_search_demo.py

      - name: E2E-Replay gegen echte Werkzeuge (mock-LLM)
        run: python scripts/e2e_replay.py

      - name: API im Hintergrund starten
        run: uvicorn production_agent.api.server:app --host 0.0.0.0 --port 8000 &

      - name: Frontend (Vite) im Hintergrund starten
        if: steps.check.outputs.present == 'true'
        run: cd frontend && npm run dev &

      - name: Auf API warten
        run: timeout 30 bash -c 'until curl -sf http://localhost:8000/docs; do sleep 1; done'

      - name: Auf Frontend warten (nur wenn gestartet)
        # Der Vite-Dev-Server (Port 5173) braucht nach dem Start einen Moment; ohne dieses Warten
        # lief Playwright gegen ERR_CONNECTION_REFUSED. Erst wenn 5173 antwortet, wird BASE_URL gesetzt.
        if: steps.check.outputs.present == 'true'
        run: timeout 60 bash -c 'until curl -sf http://localhost:5173/ >/dev/null; do sleep 1; done'

      - name: BASE_URL setzen (nur wenn Frontend gestartet)
        if: steps.check.outputs.present == 'true'
        run: echo "BASE_URL=http://localhost:5173" >> "$GITHUB_ENV"

      - name: E2E-Tests
        run: pytest -q -m e2e tests/e2e

      - name: Playwright-Traces als Artefakt sichern
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-traces
          path: playwright-traces/
          if-no-files-found: ignore
