[project]
name = "production-agent"
version = "0.1.0"
description = "Production Agent PoC – stehende Linie untersuchen (LangGraph + MCP + Claude)."
authors = [{ name = "Stefan Hüllinghorst" }]
license = { text = "MIT" }
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
  "langgraph>=0.4",
  "langgraph-checkpoint-sqlite>=2.0",
  "langchain-core>=0.3",
  "langchain-anthropic>=0.3",
  "langchain-mcp-adapters>=0.1",
  "fastmcp>=3.0",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sse-starlette>=2.1",
  "pandas>=2.2",
  "numpy>=1.26",
  "ucimlrepo>=0.0.7",
  "rank-bm25>=0.2.2",
  "qdrant-client>=1.9",
  "langfuse>=2.50",
  "structlog>=24.1",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
embeddings = ["sentence-transformers>=3.0"]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "mypy>=1.10",
  "bandit[toml]>=1.7",
  "pre-commit>=3.7",
  "httpx>=0.27",
  "anyio>=4.0",
  "agentevals>=0.0.9",
  "pip-audit>=2.7",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "UP"]
ignore = ["S101"]  # assert in tests

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "E501"]
"autopilot/*" = ["E501", "S603", "S607"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests", ".venv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not e2e'"
markers = ["e2e: End-to-End-Tests am laufenden System (Standard ausgeschlossen)"]
