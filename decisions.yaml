# decisions.yaml – Stefans Fachentscheidungen (geführte Entscheidung 11.09.2026). Einzige Quelle aller Platzhalter.
# Nie von Agenten ändern (Guardian S5). Felder mit configurable: true sind zusätzlich im Cockpit (Tab Config) umschaltbar.

ereignis:                                   # ADR-0001, Grundlage VDMA 66412 / ISO 22400-2, PackML, ISA-18.2
  beginn: "PackML-Wechsel eines Betriebsmittels von Execute nach Stopped|Held|Suspended|Aborted (Zeitstempel des Zustandswechsels)"
  erstalarm_fenster_s: 60                   # erster Alarm innerhalb ±60 s um den Wechsel wird first_alarm_code
  ende: "Rückkehr nach Execute, die mindestens 60 s stabil bleibt"
  kurzstillstand_min: 5                     # < 5 min ohne Prio-1-Alarm = Kurzstillstand (Leistungsverlust), kein Ereignis für den Agenten
  prio1_immer_ereignis: true                # Sicherheit/Anlagenschaden: jeder Prio-1-Alarm ist ein Ereignis, egal wie kurz
  zusammenfassungs_luecke_min: 5            # erneuter Stopp ≤ 5 min nach Execute gehört zum selben Ereignis
  alarmflut_alarme: 10                      # ISA-18.2 / EEMUA 191
  alarmflut_fenster_min: 10
  zeitmodell: "ISO 22400-2: ADOT (unit down time) je Ereignis, Kurzstillstände in ADET; Grund nach OEE-Verlusttyp"

linie:
  line_id: L1
  name: Verpackungslinie 1
  plant: Werk Nord
  design_rate_per_hour: 3600
  cost_per_downtime_minute_eur: 200         # Hochleistungslinie, Terminstrafen inklusive
  stationen: [Zufuehrung, Folienwickler, Schneidstation, Siegelstation, Kartonierer, Palettierer]
  vorgelagerte_anlage: {id: UP1, name: Abfuellanlage, sichtbar_als: EXT-UP}   # externe Quelle, sendet StateChange, keine eigenen Alarme

schicht:
  dauer_min: 480
  geplante_pausen_min: 30                   # kein Verfügbarkeitsverlust (VDMA 66412)
  oee_zielwert: 0.75

# Stillstandsgründe – sechs Kategorien, 14 Codes: code, kategorie, beschreibung, OEE-Verlusttyp
reason_codes:
  - [STO-FOLIE,   Stoerung,     Folienriss / Folienrolle,               availability]
  - [STO-SENSOR,  Stoerung,     Sensorfehler / verschmutzt,             availability]
  - [STO-ANTRIEB, Stoerung,     Antrieb / Lager,                        availability]
  - [STO-ELEK,    Stoerung,     Elektrik / Steuerung,                   availability]
  - [STO-SIEGEL,  Stoerung,     Siegeltemperatur / Heizung,             availability]
  - [MAT-LEER,    Material,     Zufuehrung leer,                        availability]
  - [MAT-STAU,    Material,     Produktstau,                            performance]
  - [MAT-KARTON,  Material,     Kartonvorrat leer,                      availability]
  - [SETUP,       Ruesten,      Formatwechsel,                          availability]
  - [QUAL-HOLD,   Qualitaet,    Qualitaetshalt (Pruefung),              quality]
  - [QUAL-NIO,    Qualitaet,    Ausschuss ueber Grenze,                 quality]
  - [EXT-UP,      Extern,       Vorgelagerte Anlage steht,              availability]
  - [EXT-DOWN,    Extern,       Nachgelagerte Anlage / Abtransport,     availability]
  - [ORG,         Organisation, Personal / Pause / Besprechung,         availability]

alarm_prioritaet:
  verfahren: isa18_matrix                   # configurable: true – Auswahl im Cockpit-Tab Config
  verfahren_optionen:
    isa18_matrix: "Priorität = Konsequenz (Sicherheit/Anlage/Produktion/Qualität) × Reaktionszeit (<1 / 1–10 / >10 min); vier Stufen"
    hersteller_severity: "Priorität aus OPC-UA-Severity-Bändern: 1 ≥ 800, 2 600–799, 3 400–599, 4 < 400"
  zielverteilung: {1: 0.05, 2: 0.15, 3: 0.30, 4: 0.50}

konfidenz:
  schwelle_empfehlung: 0.60                 # lieber früh ein Vorschlag, Techniker prüft ohnehin
  begruendung: >
    Auf einer Hochleistungslinie mit 200 €/min ist eine Empfehlung mit 60 % Konfidenz billiger als zehn Minuten
    Warten auf 70 %: der Techniker prüft vor Ort ohnehin, ein Fehlvorschlag kostet Minuten, ein verpasster kostet Tausende.
    Der Wert ist eine Geschäftsentscheidung des Werks und im Cockpit sichtbar.
  formel: "0.5 * regeltreffer + 0.3 * beste_fallaehnlichkeit + 0.2 * ursachenanteil_gleiche_faelle"

freigabe:
  rollen:
    inform: [Bediener, Schichtfuehrer, Instandhaltung]
    approval_required: [Schichtfuehrer, Instandhaltung]
    antrieb_elektrik: [Instandhaltung]      # STO-ANTRIEB / STO-ELEK / STO-SIEGEL nur Instandhaltung
  vier_augen_ab_kosten_eur: 5000
  timeout_min: 30                           # keine Entscheidung → Vorschlag verfällt, Audit "expired"

audit:
  personenbezug: rolle_und_hash             # configurable: true – Auswahl im Cockpit-Tab Config
  personenbezug_optionen:
    rolle_und_hash: "Rolle im Klartext, Person als SHA-256 der Personalnummer (DSGVO-Pseudonym; BetrVG §87 Abs.1 Nr.6: Auswertung nur je Linie)"
    nur_rolle: "Rolle und Zeitstempel, keinerlei Personenzuordnung"
  aufbewahrung_tage: 90

routing:                                    # einfachster Graph: keine Verzweigung
  immer_wissen_abrufen: true
  wiederholung_bei_konfidenz_unter_schwelle: false   # Backlog: einmalige Wiederholung mit 60-min-Fenster

simulation:
  seed: 42
  tage_historie: 90
  ereignisse_pro_tag: 4
  demo_ereignis_index_von_hinten: 0
  demo_alarm_code: E-4711                   # Folienriss Folienwickler → PackML Held
  replay_uhr_offset_min: 5
  replay_testfaelle: 10

llm:
  model: claude-opus-5                      # Knoten 4 (Ursache) und 6 (Maßnahmen) – Begründungsqualität in der Demo
  model_fast: claude-haiku-4-5-20251001     # LLM-as-Judge, Klassifikation
  systemprompt_kern: >
    Du bist Assistenzsystem eines Produktionsleiters. Du empfiehlst, du führst nichts aus.
    Du nennst zu jeder Aussage die Evidenz (Alarmcode, Vorfall-ID, Regel). Du erhöhst die berechnete
    Konfidenz nie, du darfst sie mit Begründung senken. Sicherheitsfunktionen sind tabu.

ui:
  kopfzeile: [Linie & PackML-Zustand, Stillstand seit (min), Kosten bisher (€), Beste Hypothese (Konfidenz)]
  tabs: [Live-MES, Medallion, Agent, Status, Config]
  config_seite: [alarm_prioritaet.verfahren, audit.personenbezug, konfidenz.schwelle_empfehlung]   # zur Laufzeit umschaltbar, Änderung wird auditiert
  panels_pflicht: [1, 2, 6, 7]

normen:
  packml: "ISA-TR88.00.02-2022"
  alarmmanagement: ["ISA-18.2-2016", "IEC 62682:2022", "EEMUA 191 4th ed. 2024"]
  kennzahlen: ["VDMA 66412-1", "ISO 22400-2:2014"]
  mes_begriffe: "ISA-95 / IEC 62264"
  funktionale_sicherheit: ["ISO 13849-1:2023", "IEC 61508"]
  ot_security: "IEC 62443 – Agent außerhalb der Steuerungszone, nur lesend"

recht:
  eu_ai_act: "Empfehlungssystem mit menschlicher Aufsicht (Art. 14), kein Sicherheitsbauteil (Art. 6 Abs. 1 i.V.m. Maschinen-VO 2023/1230); Transparenz Art. 13 durch Evidenz je Aussage; Einordnung dokumentiert, kein Rechtsrat"
  maschinenrichtlinie: "kein Eingriff in SRP/CS; Schutzeinrichtungen, Not-Halt, Verriegelungen sind FORBIDDEN"
  produkthaftung: "Empfehlen ≠ Ausführen – Ausführung bleibt beim qualifizierten Menschen"
  dsgvo: "siehe audit.personenbezug; Zweckbindung Anlagenentscheidung, nicht Leistungsbewertung"
  betrvg_87_1_6: "Protokollierung von Bedienerentscheidungen ist mitbestimmungspflichtig – Rolle statt Person, Auswertung je Linie"
  daten_lizenzen: {ai4i: "CC BY 4.0, UCI id 601 – Regeln/Wertebereiche", alpi: "IEEE DataPort DOI 10.21227/nfv6-k750 – Struktur"}
