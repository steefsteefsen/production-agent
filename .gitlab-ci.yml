stages: [lint, test, security, evals, e2e]

default:
  image: python:3.11-slim
  before_script:
    - pip install -e ".[dev]"

lint:
  stage: lint
  script:
    - ruff check .
    - ruff format --check .

test:
  stage: test
  script:
    - pytest --cov=production_agent --cov-report=term-missing
  coverage: '/TOTAL.*\s+(\d+%)$/'

security:
  stage: security
  script:
    - bandit -c pyproject.toml -r src
    - pip install pip-audit && pip-audit
  allow_failure: false

# Replay-Eval im Mock-Modus: kostenlos, offline, ohne API-Schlüssel und ohne Langfuse.
# Der kostenpflichtige Live-Lauf (--live) bleibt dem manuellen e2e-live-Job vorbehalten.
evals:
  stage: evals
  variables:
    LLM_MODE: mock
  script:
    - python -m production_agent.data.simulator
    - python evals/run_evals.py
    - test -s evals/report.md
  artifacts:
    when: always
    paths:
      - evals/report.md
      - evals/scenarios.json
    expire_in: 30 days

e2e-live:
  stage: e2e
  before_script:
    - pip install -e ".[dev,e2e]"
    - playwright install chromium --with-deps
  variables:
    LLM_MODE: live
    ANTHROPIC_API_KEY: $ANTHROPIC_API_KEY
    LANGFUSE_HOST: $LANGFUSE_HOST
    LANGFUSE_PUBLIC_KEY: $LANGFUSE_PUBLIC_KEY
    LANGFUSE_SECRET_KEY: $LANGFUSE_SECRET_KEY
  script:
    - python -m production_agent.data.simulator
    - uvicorn production_agent.api.server:app --host 0.0.0.0 --port 8000 &
    - timeout 30 bash -c 'until curl -sf http://localhost:8000/docs; do sleep 1; done'
    - python evals/run_evals.py --live
    - BASE_URL=http://localhost:8000 pytest -q -m e2e tests/e2e
  artifacts:
    when: always
    paths:
      - playwright-traces/
    expire_in: 7 days
  rules:
    - if: '$CI_COMMIT_TAG =~ /^wp\//'
      when: on_success
    - when: manual
      allow_failure: true
